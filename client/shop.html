<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Мой сайт</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="auth.html">Авторизация</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="functional.html">Функции</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="shop.html">Магазин</a>
                </li>
            </ul>
            <button id="cart-btn" class="btn btn-outline-light me-2">
                Корзина (<span id="cart-count">0</span>)
            </button>
            <button id="logout-btn" class="btn btn-outline-light">Выйти</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="auth-required" style="display: none;">
            <div class="alert alert-warning">
                Для доступа к магазину необходимо авторизоваться
            </div>
        </div>

        <div id="shop-content" style="display: none;">
            <div class="row mb-4">
                <div class="col">
                    <button id="add-product-btn" class="btn btn-primary">Добавить товар</button>
                </div>
            </div>

            <div id="products-container" class="row row-cols-1 row-cols-md-3 g-4">
                <!-- Товары будут добавлены через JavaScript -->
            </div>
        </div>

        <!-- Модальное окно корзины -->
        <div class="modal fade" id="cartModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Корзина</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="cart-items">
                            <!-- Товары в корзине -->
                        </div>
                        <div class="mt-3">
                            <h5>Итого: <span id="cart-total">0</span> ₽</h5>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                        <button type="button" class="btn btn-primary" id="checkout-btn">Оформить заказ</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Модальное окно добавления товара -->
        <div class="modal fade" id="addProductModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Добавить товар</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="add-product-form">
                            <div class="mb-3">
                                <label class="form-label">Название</label>
                                <input type="text" class="form-control" id="product-name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Описание</label>
                                <textarea class="form-control" id="product-description" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Цена</label>
                                <input type="number" class="form-control" id="product-price" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">URL изображения</label>
                                <input type="url" class="form-control" id="product-image" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="button" class="btn btn-primary" id="save-product-btn">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
